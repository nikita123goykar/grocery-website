<!DOCTYPE html>
<html>

<head>
    <title>Grocery Price Comparison Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🛒</div>

        <div>
            <h1>Grocery Price Comparison</h1>
            <p>Compare Prices • Offers • Save Money</p>
        </div>
    </header>


    <div class="container">

        <div class="search-section">

            <h2>🔍 Find Best Grocery Price</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="product"
                    placeholder="Enter product name"
                >

                <button onclick="searchProduct()">
                    Search
                </button>

            </div>

            <p class="hint">
                Example: Rice, Sugar, Milk, Oil, Wheat, Atta, Poha
            </p>

        </div>


        <div id="result"></div>

    </div>


    <footer>

        <p>🛒 Grocery Price Comparison Tool</p>

        <p>Compare • Save • Shop Smart</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
